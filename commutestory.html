<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>commute story</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Parisienne&display=swap" rel="stylesheet">

<style>
:root {
  --background: #F3B3D5;
  --text: #8C2D65;
  --accent: #FF68B2;
  --cream: #fff8fb;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--text);
  font-family: "Cormorant Garamond", Georgia, serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,.48) 0 2px, transparent 3px),
    radial-gradient(circle at 78% 18%, rgba(255,255,255,.42) 0 2px, transparent 3px),
    linear-gradient(180deg, #f8c9e3 0%, var(--background) 48%, #f7c2df 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .25;
  z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.28) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.2) 1px, transparent 1px);
  background-size: 30px 30px;
}

.lace {
  position: fixed;
  top: 0;
  width: 190px;
  height: 128px;
  z-index: 4;
  pointer-events: none;
  opacity: .94;
}

.lace.left { left: 0; }
.lace.right { right: 0; transform: scaleX(-1); }

.lace::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20px 18px, rgba(255,255,255,.96) 0 7px, transparent 8px) 0 0/30px 26px,
    radial-gradient(circle at 15px 29px, transparent 0 8px, rgba(255,255,255,.96) 9px 11px, transparent 12px) 0 0/30px 26px,
    linear-gradient(155deg, rgba(255,255,255,.96), rgba(255,255,255,.52));
  clip-path: polygon(0 0, 100% 0, 78% 28%, 54% 46%, 28% 71%, 0 100%);
  filter: drop-shadow(0 6px 9px rgba(140,45,101,.12));
}

.decor, .spark-field {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}

.float {
  position: absolute;
  animation: floaty var(--duration) ease-in-out infinite alternate;
  opacity: .75;
  filter: drop-shadow(0 4px 6px rgba(255,255,255,.45));
}

.float:nth-child(1) { left: 3%; top: 17%; font-size: 38px; --duration: 8s; }
.float:nth-child(2) { right: 4%; top: 25%; font-size: 42px; --duration: 10s; animation-delay: -2s; }
.float:nth-child(3) { left: 5%; top: 56%; font-size: 30px; --duration: 9s; animation-delay: -3s; }
.float:nth-child(4) { right: 6%; top: 67%; font-size: 34px; --duration: 7s; animation-delay: -1s; }
.float:nth-child(5) { left: 4%; top: 86%; font-size: 34px; --duration: 11s; animation-delay: -4s; }
.float:nth-child(6) { right: 5%; top: 91%; font-size: 28px; --duration: 8s; animation-delay: -5s; }

@keyframes floaty {
  from { transform: translate3d(0,0,0) rotate(-4deg) scale(.96); }
  to { transform: translate3d(14px,-22px,0) rotate(5deg) scale(1.05); }
}

.spark {
  position: absolute;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 10px white, 0 0 18px var(--accent);
  animation: twinkle 3s ease-in-out infinite, fall 15s linear infinite;
}

@keyframes twinkle {
  0%,100% { opacity: .25; transform: scale(.7); }
  50% { opacity: 1; transform: scale(1.45); }
}

@keyframes fall {
  from { translate: 0 -14vh; }
  to { translate: 7vw 114vh; }
}

.wrapper {
  position: relative;
  z-index: 2;
  width: min(1100px, calc(100% - 28px));
  margin: 0 auto;
  padding: 44px 0 74px;
}

.scrap {
  position: relative;
  padding: 18px;
}

.layer {
  position: absolute;
  inset: 16px 6px 4px 8px;
  background: #ffc7e4;
  border: 2px dashed rgba(140,45,101,.22);
  border-radius: 42px;
  transform: rotate(-1.2deg);
  box-shadow: 0 20px 50px rgba(140,45,101,.13);
}

.layer.two {
  inset: 2px 20px 18px 22px;
  background: #ffe8f3;
  transform: rotate(1.1deg);
}

.card {
  position: relative;
  overflow: hidden;
  padding: clamp(22px, 3vw, 38px);
  background: rgba(255,248,251,.91);
  border: 3px solid rgba(255,104,178,.56);
  border-radius: 38px;
  box-shadow: 0 28px 68px rgba(140,45,101,.23);
  backdrop-filter: blur(12px);
}

.card::before {
  content: "♡  ✦  ♡  ✧  ♡";
  position: absolute;
  top: 16px;
  left: 24px;
  color: var(--accent);
  opacity: .58;
  font-size: 18px;
  letter-spacing: 8px;
  transform: rotate(-4deg);
}

header {
  text-align: center;
  padding: 38px 10px 26px;
}

h1 {
  margin: 0;
  font-family: "Parisienne", cursive;
  font-weight: 400;
  font-size: clamp(72px, 11vw, 132px);
  line-height: .92;
  color: var(--text);
  text-shadow: 0 3px 0 white, 0 0 20px rgba(255,104,178,.33);
}

.subtitle {
  max-width: 700px;
  margin: 16px auto 0;
  font-size: clamp(18px, 2.5vw, 25px);
  color: #a44b79;
}

.ribbon {
  width: min(630px, 88%);
  height: 15px;
  margin: 14px auto 38px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent 0 5%, #ff79bb 5% 44%, #ffd4e8 44% 56%, #ff79bb 56% 95%, transparent 95%);
  box-shadow: 0 5px 15px rgba(140,45,101,.12);
  position: relative;
}

.ribbon::before, .ribbon::after {
  content: "♡";
  position: absolute;
  top: 50%;
  transform: translateY(-56%);
  font-size: 28px;
  color: var(--accent);
}
.ribbon::before { left: -10px; }
.ribbon::after { right: -10px; }

.story {
  display: grid;
  grid-template-columns: 1fr;
  gap: clamp(30px, 5vw, 56px);
}

.frame {
  position: relative;
  padding: 16px 16px 22px;
  background: linear-gradient(145deg, rgba(255,255,255,.95), rgba(255,231,244,.93));
  border: 2px solid rgba(255,104,178,.55);
  border-radius: 30px;
  box-shadow: 0 18px 42px rgba(140,45,101,.17);
}

.frame:nth-child(odd) { transform: rotate(-.35deg); }
.frame:nth-child(even) { transform: rotate(.4deg); }

.frame::before {
  content: "";
  position: absolute;
  width: 96px;
  height: 26px;
  left: 50%;
  top: -11px;
  transform: translateX(-50%) rotate(-3deg);
  background: rgba(255,227,241,.88);
  border: 1px solid rgba(255,104,178,.25);
  box-shadow: 0 4px 9px rgba(140,45,101,.08);
}

.frame img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 21px;
  border: 3px solid white;
  box-shadow: 0 12px 28px rgba(140,45,101,.16);
}

.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 15px 7px 1px;
}

.label {
  font-family: "Parisienne", cursive;
  font-size: clamp(34px, 5vw, 52px);
}

.num {
  display: grid;
  place-items: center;
  min-width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff68b2, #ff9dd0);
  color: white;
  border: 3px solid white;
  font-size: 18px;
  font-weight: 600;
  box-shadow: 0 6px 17px rgba(255,104,178,.38);
}

.charm {
  position: absolute;
  right: -22px;
  top: 18%;
  width: 34px;
  height: 148px;
  border: 3px dotted #ff7abb;
  border-radius: 22px;
  opacity: .84;
}

.charm::before, .charm::after {
  content: "♡";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  color: var(--accent);
  font-size: 24px;
  text-shadow: 0 2px white;
}
.charm::before { top: -18px; }
.charm::after { bottom: -18px; }

footer {
  text-align: center;
  margin-top: 40px;
  font-size: 18px;
  color: #a5517e;
}

.top-button {
  display: inline-block;
  margin-top: 12px;
  padding: 11px 22px;
  border-radius: 999px;
  color: white;
  text-decoration: none;
  font-weight: 600;
  background: linear-gradient(135deg, #ff68b2, #ff9fd1);
  box-shadow: 0 10px 24px rgba(255,104,178,.35);
  transition: transform .2s ease, box-shadow .2s ease;
}

.top-button:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 34px rgba(255,104,178,.52), 0 0 22px rgba(255,255,255,.75);
}

@media (max-width: 700px) {
  .wrapper {
    width: min(100% - 16px, 760px);
    padding-top: 22px;
  }
  .scrap { padding: 10px; }
  .card {
    padding: 13px;
    border-radius: 28px;
  }
  header { padding: 42px 4px 22px; }
  .frame {
    padding: 10px 10px 16px;
    border-radius: 24px;
  }
  .frame img { border-radius: 17px; }
  .charm { right: -13px; transform: scale(.8); }
  .lace { width: 118px; height: 86px; }
  .float { opacity: .58; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
