<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 commute story</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Parisienne&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F3B3D5;
    --text: #8C2D65;
    --accent: #FF68B2;
    --accent-soft: #ffd3ea;
    --cream: #fff8fb;
    --rose: #ff9bcf;
    --deep: #8C2D65;
    --shadow: rgba(140, 45, 101, .22);
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,.45) 0 2px, transparent 3px),
      radial-gradient(circle at 85% 20%, rgba(255,255,255,.38) 0 3px, transparent 4px),
      linear-gradient(180deg, #f8c9e3 0%, var(--bg) 45%, #f6bddc 100%);
    font-family: "Cormorant Garamond", Georgia, serif;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: .35;
    background-image:
      linear-gradient(rgba(255,255,255,.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.5), transparent 70%);
  }

  .background-decor,
  .sparkles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }

  .floaty {
    position: absolute;
    opacity: .78;
    filter: drop-shadow(0 5px 8px rgba(255,255,255,.25));
    animation: drift var(--speed) ease-in-out infinite alternate;
  }

  .floaty:nth-child(1) { left: 4%; top: 12%; font-size: 38px; --speed: 8s; }
  .floaty:nth-child(2) { right: 5%; top: 18%; font-size: 44px; --speed: 10s; animation-delay: -2s; }
  .floaty:nth-child(3) { left: 8%; top: 52%; font-size: 30px; --speed: 7s; animation-delay: -1s; }
  .floaty:nth-child(4) { right: 7%; top: 60%; font-size: 34px; --speed: 9s; animation-delay: -3s; }
  .floaty:nth-child(5) { left: 3%; top: 82%; font-size: 36px; --speed: 11s; animation-delay: -5s; }
  .floaty:nth-child(6) { right: 5%; top: 88%; font-size: 28px; --speed: 8s; animation-delay: -4s; }

  @keyframes drift {
    0% { transform: translate3d(0, 0, 0) rotate(-4deg) scale(.95); }
    100% { transform: translate3d(14px, -22px, 0) rotate(5deg) scale(1.05); }
  }

  .spark {
    position: absolute;
    width: 7px;
    height: 7px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white, 0 0 18px var(--accent);
    opacity: .85;
    animation: twinkle 3.4s ease-in-out infinite, fall 14s linear infinite;
  }

  @keyframes twinkle {
    0%,100% { transform: scale(.7); opacity: .25; }
    50% { transform: scale(1.45); opacity: 1; }
  }

  @keyframes fall {
    from { translate: 0 -12vh; }
    to { translate: 8vw 112vh; }
  }

  .page {
    position: relative;
    z-index: 2;
    width: min(1080px, calc(100% - 28px));
    margin: 0 auto;
    padding: 20px 0 76px;
  }

  .nameplate {
    width: fit-content;
    max-width: 90%;
    margin: 0 auto 16px;
    padding: 9px 20px 10px;
    text-align: center;
    font-size: clamp(20px, 3vw, 30px);
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--deep);
    background: rgba(255,248,251,.88);
    border: 2px solid rgba(255,104,178,.78);
    border-radius: 999px;
    box-shadow: 0 10px 26px rgba(140,45,101,.16), inset 0 0 0 3px rgba(255,255,255,.55);
    backdrop-filter: blur(8px);
  }

  .scrap-wrap {
    position: relative;
    padding: 18px;
    margin-top: 8px;
  }

  .paper-layer {
    position: absolute;
    inset: 24px 6px 0 8px;
    border-radius: 42px;
    background: #ffc6e4;
    border: 2px dashed rgba(140,45,101,.22);
    transform: rotate(-1.3deg);
    box-shadow: 0 22px 50px rgba(140,45,101,.12);
  }

  .paper-layer.two {
    inset: 8px 18px 16px 22px;
    background: #ffe4f1;
    transform: rotate(1.1deg);
    opacity: .92;
  }

  .content-card {
    position: relative;
    border-radius: 38px;
    background: rgba(255,248,251,.9);
    border: 3px solid rgba(255,104,178,.55);
    box-shadow: 0 28px 70px rgba(140,45,101,.22);
    padding: clamp(14px, 2.5vw, 28px);
    overflow: hidden;
    backdrop-filter: blur(14px);
  }

  .content-card::before {
    content: "♡  ✦  ♡  ✧  ♡";
    position: absolute;
    top: 14px;
    left: 24px;
    font-size: 19px;
    color: var(--accent);
    opacity: .6;
    letter-spacing: 8px;
    transform: rotate(-4deg);
  }

  .hero {
    position: relative;
    margin-top: 16px;
    border-radius: 28px;
    overflow: hidden;
    border: 4px solid var(--accent);
    box-shadow: 0 18px 38px var(--shadow);
    background: var(--accent-soft);
  }

  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero-badge {
    position: absolute;
    left: 18px;
    top: 18px;
    padding: 8px 15px;
    border-radius: 999px;
    background: rgba(255,248,251,.92);
    border: 2px solid var(--accent);
    box-shadow: 0 8px 22px rgba(140,45,101,.2);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .06em;
  }

  h1 {
    font-family: "Parisienne", cursive;
    font-weight: 400;
    font-size: clamp(58px, 9vw, 118px);
    line-height: .9;
    text-align: center;
    margin: 38px 0 10px;
    color: var(--deep);
    text-shadow: 0 3px 0 #fff, 0 0 20px rgba(255,104,178,.35);
  }

  .subtitle {
    text-align: center;
    font-size: clamp(18px, 2.8vw, 25px);
    margin: 0 auto 30px;
    max-width: 700px;
    color: #a74b79;
  }

  .ribbon {
    width: min(620px, 88%);
    margin: 18px auto 30px;
    height: 16px;
    border-radius: 999px;
    background:
      linear-gradient(90deg, transparent 0 4%, #ff78ba 4% 43%, #ffd3e8 43% 57%, #ff78ba 57% 96%, transparent 96%),
      linear-gradient(180deg, #fff, #ffc8e1);
    box-shadow: 0 5px 14px rgba(140,45,101,.14);
    position: relative;
  }

  .ribbon::before, .ribbon::after {
    content: "♡";
    position: absolute;
    top: 50%;
    transform: translateY(-54%);
    font-size: 28px;
    color: var(--accent);
    text-shadow: 0 2px 0 white;
  }
  .ribbon::before { left: -12px; }
  .ribbon::after { right: -12px; }

  .story {
    display: grid;
    grid-template-columns: 1fr;
    gap: clamp(26px, 5vw, 52px);
  }

  .panel {
    position: relative;
    padding: 16px 16px 22px;
    border-radius: 30px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.92), rgba(255,233,245,.92));
    border: 2px solid rgba(255,104,178,.55);
    box-shadow: 0 18px 42px rgba(140,45,101,.17);
  }

  .panel:nth-child(even) {
    transform: rotate(.45deg);
  }

  .panel:nth-child(odd) {
    transform: rotate(-.35deg);
  }

  .panel::before {
    content: "";
    position: absolute;
    width: 92px;
    height: 26px;
    left: 50%;
    top: -10px;
    transform: translateX(-50%) rotate(-3deg);
    background: rgba(255,228,242,.82);
    border: 1px solid rgba(255,104,178,.24);
    box-shadow: 0 4px 10px rgba(140,45,101,.08);
  }

  .panel img {
    width: 100%;
    display: block;
    border-radius: 21px;
    border: 3px solid #fff;
    box-shadow: 0 12px 30px rgba(140,45,101,.17);
  }

  .caption-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 16px 8px 2px;
  }

  .caption {
    font-family: "Parisienne", cursive;
    font-size: clamp(34px, 5vw, 54px);
    color: var(--deep);
  }

  .number {
    min-width: 42px;
    height: 42px;
    display: inline-grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff68b2, #ff9bcf);
    color: white;
    font-size: 18px;
    font-weight: 600;
    border: 3px solid white;
    box-shadow: 0 6px 16px rgba(255,104,178,.35);
  }

  .bracelet {
    position: absolute;
    right: -22px;
    top: 20%;
    width: 34px;
    height: 150px;
    border-radius: 22px;
    border: 3px dotted #ff7cbb;
    opacity: .85;
  }

  .bracelet::before,
  .bracelet::after {
    content: "♡";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: var(--accent);
    font-size: 24px;
    text-shadow: 0 2px white;
  }
  .bracelet::before { top: -18px; }
  .bracelet::after { bottom: -18px; }

  .footer {
    margin-top: 42px;
    text-align: center;
    font-size: 18px;
    color: #a4517e;
  }

  .pill {
    display: inline-block;
    margin-top: 12px;
    padding: 11px 22px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff67b2, #ff9ccf);
    color: white;
    text-decoration: none;
    font-weight: 600;
    box-shadow: 0 10px 24px rgba(255,104,178,.34);
    transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
  }

  .pill:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 34px rgba(255,104,178,.52), 0 0 22px rgba(255,255,255,.75);
    filter: saturate(1.08);
  }

  /* Lace corners */
  .lace {
    position: fixed;
    top: 0;
    width: 180px;
    height: 126px;
    z-index: 3;
    pointer-events: none;
    opacity: .9;
  }
  .lace.left { left: 0; transform: rotate(-2deg); }
  .lace.right { right: 0; transform: scaleX(-1) rotate(-2deg); }
  .lace::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 22px 18px, rgba(255,255,255,.95) 0 7px, transparent 8px) 0 0/30px 26px,
      radial-gradient(circle at 15px 28px, transparent 0 8px, rgba(255,255,255,.95) 9px 11px, transparent 12px) 0 0/30px 26px,
      linear-gradient(160deg, rgba(255,255,255,.92), rgba(255,255,255,.55));
    clip-path: polygon(0 0, 100% 0, 78% 32%, 54% 46%, 28% 70%, 0 100%);
    filter: drop-shadow(0 5px 9px rgba(140,45,101,.12));
  }

  @media (max-width: 700px) {
    .page {
      width: min(100% - 16px, 760px);
      padding-top: 14px;
    }
    .nameplate {
      font-size: 20px;
      margin-bottom: 10px;
    }
    .scrap-wrap {
      padding: 10px;
    }
    .content-card {
      padding: 12px;
      border-radius: 28px;
    }
    .hero {
      margin-top: 28px;
      border-radius: 22px;
    }
    .hero-badge {
      top: 12px;
      left: 12px;
      font-size: 13px;
      padding: 6px 11px;
    }
    .panel {
      padding: 10px 10px 16px;
      border-radius: 24px;
    }
    .panel img {
      border-radius: 17px;
    }
    .bracelet {
      right: -13px;
      transform: scale(.8);
    }
    .lace {
      width: 118px;
      height: 86px;
    }
    .floaty {
      opacity: .6;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

    <span class="floaty">🎀</span>

    <span class="floaty">💗</span>
